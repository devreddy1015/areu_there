# Saans gateway configuration. Run: saans-gateway --config saans.toml
# Unknown keys are errors, so a typo cannot silently change a setting.

# UDP port the sensors send FeatureFrames (and debug raw CSI) to.
udp_port = 5566
# Interface to receive on. Sensors are remote, so all interfaces by default;
# put the gateway's sensor-VLAN address here to narrow it.
udp_bind = "0.0.0.0"
# HTTP API + dashboard. Localhost by default, where every request is
# treated as a local admin. Binding wider (for example "0.0.0.0:8080")
# turns authentication on automatically, and the gateway then refuses to
# start unless a [[user]] or [[token]] exists. See [auth] below.
http_addr = "127.0.0.1:8080"
# Event logs (events-YYYY-MM-DD.jsonl) and history.json live here.
data_dir = "saans-data"
# DPDP retention: an event log is deleted once all its events are older.
event_retention_days = 30
# history.json holds one summary per space per day -- occupied seconds,
# motion bouts, pauses, and for consented spaces a resting breathing
# median. Aggregates are normally kept longer than the raw events they
# summarise, so this is usually >= event_retention_days -- but nothing
# enforces that, because a gateway refusing to start over a setting that
# keeps *less* data would be the worse failure. It bounds age;
# saans-health caps the same list at 90 entries, which bounds memory and
# is not the same thing.
history_retention_days = 90
# Local time offset from UTC in minutes (India: 330). Sets the day
# boundary of event logs and daily summaries.
utc_offset_minutes = 330

# raw CSI (debug / data collection only, ADR-001). The gateway runs
# the same DSP the node would. Raw links are listed as { rx = node, tx = 255 }.
[raw]
sample_rate_hz = 20.0   # the CSI rate the nodes are driven at
subcarriers = 0         # 0 = take the count from each node's first datagram
calibration_s = 30.0    # empty-room calibration; keep the space empty at start

# Bounded in-memory time series behind /api/history, which is what the
# dashboard's trend charts read. Never written to disk: a minute-by-minute
# motion trace is exactly the record DPDP retention limits exist for, so
# the window IS the retention policy and a restart is a delete.
# Memory is fixed at startup: window_s / cadence_s points per series.
[history]
window_s = 3600.0    # how far back the charts can go (max 21600)
cadence_s = 2.0      # one point per this many seconds (min 0.5)

# Who may see what. `required` is automatic: on by default unless
# http_addr is a loopback address. Roles are admin / ops / safety /
# occupancy -- see README. `spaces` limits a principal to named spaces;
# omit it for all of them.
#
#   [auth]
#   session_hours = 12
#
#   [[user]]                       # saans-gateway --hash-password
#   name = "ana"
#   role = "safety"
#   password_hash = "$argon2id$v=19$m=19456,t=2,p=1$...$..."
#   spaces = ["rest-room-1"]
#
#   [[token]]                      # Authorization: Bearer <token>
#   name = "building-management"
#   role = "occupancy"
#   sha256 = "<lowercase hex sha256 of the token>"

# One [[space]] per monitored room. A link is (receiving node, transmitting
# node); tx = 255 means "an access point / unknown". Each link belongs to at
# most one space; frames from links no space lists are counted in
# /api/health so a misconfigured node is easy to find.
[[space]]
id = "reading-room"
name = "Reading room"
links = [{ rx = 1, tx = 255 }, { rx = 2, tx = 255 }]
# ADR-005: breathing and heart data only with the occupants' written consent.
vitals = false
inactivity_alert_min = 30.0
# Off by default: WiFi cannot tell "fell" from "sat down heavily".
collapse_detection = false

[[space]]
id = "rest-room-1"
name = "Rest room 1 (consented)"
links = [{ rx = 3, tx = 4 }, { rx = 5, tx = 4 }]
vitals = true
# 0 = automatic: 1 vote with fewer than 3 usable links, else a majority.
presence_quorum = 0
inactivity_alert_min = 20.0
collapse_detection = false
breathing_pause_min_s = 10.0
rate_high_bpm = 24.0
rate_low_bpm = 8.0
