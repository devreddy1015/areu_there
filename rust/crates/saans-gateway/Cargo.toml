[package]
name = "saans-gateway"
description = "Saans gateway: FeatureFrame / raw-CSI ingest, per-space fusion and health detectors, event log, HTTP API, WebSocket, /metrics and the embedded dashboard."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "saans-gateway"
path = "src/main.rs"

[dependencies]
saans-dsp = { path = "../saans-dsp" }
saans-health = { path = "../saans-health" }
# Simulate mode (`--simulate`): the synthetic sensing explorer.
saans-sim = { path = "../saans-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
# Output interfaces (SAANS_PLAN.md §10)
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
rumqttc = { version = "0.24", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
rumqttd = "0.19"

[lints.clippy]
# Every handler helper in `http.rs` returns `Result<T, Response>`, where the
# error *is* the HTTP response to send: `principal`, `system_only`, the four
# `sim_*` guards. The lint asks us to box it because `Response` is 128 bytes.
# Boxing would put an allocation on every rejected request -- the auth-failure
# path, which is the one an attacker drives -- to shrink a `Result` that is
# constructed once and immediately returned. That is a worse trade than the
# lint assumes, so it is off here and nowhere else in the workspace.
result_large_err = "allow"
