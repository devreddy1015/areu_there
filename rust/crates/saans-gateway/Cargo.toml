[package]
name = "saans-gateway"
description = "Saans gateway: FeatureFrame / raw-CSI ingest, per-space fusion and health detectors, event log, HTTP API, WebSocket, /metrics and the embedded dashboard."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "saans-gateway"
path = "src/main.rs"

[features]
# The room demo at /roomsim and its room stream at /api/roomsim (ADR-008,
# spec/livedemo.md). Off by default: decision 13 says the view is compiled
# in only on purpose. The stream runs Room Sim and Locate in the gateway,
# and reads scenes WITHOUT saans-scene's `write` (ADR-008 decision 1;
# saans-scene/tests/boundary.rs READERS).
roomsim = ["dep:saans-roomsim", "dep:saans-locate", "dep:saans-scene"]

[dependencies]
saans-dsp = { path = "../saans-dsp" }
saans-health = { path = "../saans-health" }
saans-roomsim = { path = "../saans-roomsim", optional = true }
saans-locate = { path = "../saans-locate", features = ["roomsim"], optional = true }
saans-scene = { path = "../saans-scene", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
# Output interfaces (SAANS_PLAN.md §10)
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
rumqttc = { version = "0.24", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
rumqttd = "0.19"
