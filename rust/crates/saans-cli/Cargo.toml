[package]
name = "saans-cli"
description = "saans: simulate, evaluate and benchmark the Saans pipeline end to end (SYNTHETIC evaluation harness)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "saans"
path = "src/main.rs"

[dependencies]
saans-dsp = { path = "../saans-dsp" }
saans-health = { path = "../saans-health" }
saans-sim = { path = "../saans-sim" }
saans-scene = { path = "../saans-scene", features = ["write"] }
# Room Sim v1 (spec/roomsim.md), for `saans roomsim-export`. Everything it
# produces is SIM.
saans-roomsim = { path = "../saans-roomsim" }
# Locate v1 on a Room Sim run, for `saans roomsim-eval` (spec/livedemo.md
# §10): the streaming driver, the score and the records file. SIM.
saans-locate = { path = "../saans-locate", features = ["roomsim"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# scene_sha256 in the roomsim-export manifest (the digest of the file's bytes).
sha2 = "0.10"
# `saans gen-dataset` (spec/dataset.md): scenes run in parallel; the output
# does not depend on the thread count (§9).
rayon = "1"
