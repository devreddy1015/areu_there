[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

# The simulation crates on the live demo's path (spec/livedemo.md, Rules).
# CI runs every test in the dev profile, where workspace members otherwise
# build at opt-level 0 and a 120 s Room Sim calibration takes 7-17 s.
# Float results do not change (Rust contracts no FMA; the black_box guards
# stay); overflow checks and debug assertions stay on.
[profile.dev.package.saans-roomsim]
opt-level = 2

[profile.dev.package.saans-locate]
opt-level = 2

[profile.dev.package.saans-scene]
opt-level = 2

[profile.dev.package.saans-sim]
opt-level = 2

[profile.dev.package.saans-dsp]
opt-level = 2
