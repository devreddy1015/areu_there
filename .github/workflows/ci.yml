# Tests, lints and golden-vector drift.
#
# The repository had CodeQL and Pages but nothing that ran a test, so a pull
# request could go green while the suite was red. These jobs are the
# commands README.md already tells a reader to run, so CI and a laptop agree
# by construction rather than by someone remembering to keep them in step.
#
# The slow Python sweeps (`evaluate.py`) are deliberately NOT here. They take
# minutes, they are a measurement rather than a check, and their output is a
# table someone reads -- a red X would not tell you anything you could act on.
# They stay a thing you run when you have changed the DSP.
name: ci

on:
  push:
    branches: [main]
  # Every pull request, not only those into main: a stacked PR whose base is
  # another branch otherwise gets no checks at all, and reads as untested
  # rather than as failing.
  pull_request:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failed build should not also cost a minute of backtrace formatting.
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml picks the channel and pulls in rustfmt and clippy.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Formatting first: it compiles nothing and fails in about three
      # seconds, so a misformatted branch does not pay for a full build.
      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --locked so a dependency cannot be resolved differently here than it
      # was on the machine that wrote Cargo.lock.
      - name: cargo test
        working-directory: rust
        run: cargo test --workspace --locked

  python:
    name: python (reference implementation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No `cache: pip`: there is no requirements.txt or pyproject.toml to
          # hash, and setup-python errors out when it cannot find one. The
          # package is standard library only, by design (ADR-002), so there is
          # nothing to install and nothing to cache.

      # Run from the repository root: the suite imports the `wifisense`
      # package from the working directory.
      - name: unittest
        run: python3 -m unittest discover -s tests

  edge:
    name: edge (C++ firmware DSP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The Makefile's `check` target is already `all-compilers`, which loops
      # over g++ and clang++ with a clean between them, so both compilers are
      # covered by the one invocation. ubuntu-latest ships g++; clang is not
      # guaranteed, so it is installed explicitly.
      - name: install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: compiler versions
        run: |
          g++ --version
          clang++ --version

      # Measured at about 140 s locally, of which roughly 60 s is the
      # benchmark driving a 3,267-frame recording.
      - name: make check
        run: make -C edge/dsp/test check

      # The same suite built for a CPU with a fused multiply-add. The ESP32-S3
      # has one; plain x86-64 does not, so the default build above cannot see
      # contraction at all. The Makefile disables it (FPFLAGS); this step is
      # what fails if anyone stops it doing so. It is how the problem was
      # found: on Ubuntu 26.04 a bit-for-bit check in test_vitals failed under
      # g++, and -march=x86-64-v3 reproduced it locally.
      - name: make test, built with FMA available
        run: make -C edge/dsp/test clean test OPT="-O2 -march=x86-64-v3"

  golden:
    name: golden-vector drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ADR-002: Python is the spec. If regenerating the golden vectors
      # changes them, then either the Python DSP moved without the vectors
      # being regenerated, or the vectors were hand-edited. Both are the same
      # bug: the Rust and C++ ports are now being checked against something
      # that is not the reference.
      #
      # This was `git diff --exit-code` for exactly one push, and it failed
      # on a clean checkout. Regenerating here produces three sim_geometric
      # files byte-different from the committed ones, which were generated
      # on a different distribution and CPython. What moved is everything
      # downstream of math.sin and math.cos -- the platform's libm, which is
      # not required to be correctly rounded. The Mersenne Twister files did
      # not move, because that generator is reproducible by specification.
      #
      # Byte-equality was never ADR-002's contract; 1e-9 relative for Rust
      # is. check_drift.py asks that question instead, at 1e-11, and prints
      # the observed worst case every run so the margin stays visible. It
      # restores the committed vectors before exiting, pass or fail, so a
      # red job does not also leave a dirty checkout.
      - name: regenerate and compare
        run: python3 spec/golden/check_drift.py

  results:
    name: results tables and the prose that quotes them
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # One of the CI-tier tables is the Rust receiver-impairment example,
      # built in release because the debug build of the simulator is slow
      # enough to dominate the job.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: results

      # Every stale number found in review had the same history: typed into
      # a document from memory of a result, then the code moved. This
      # regenerates the fast tables in docs/RESULTS.md and checks both the
      # file and every figure README and NOTES quote from it. Slow tables
      # (the full Fresnel sweep, the held-out detector evaluation) are
      # regenerated by hand and not checked here -- see tools/results.py.
      - name: results.py --check
        run: python3 tools/results.py --check

  browser:
    name: browser smoke tests (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust/crates/saans-gateway/tests/browser
    steps:
      - uses: actions/checkout@v4

      # setup.mjs builds the gateway and the fixture generator itself, so
      # the suite is one command here and on a laptop.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: browser

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rust/crates/saans-gateway/tests/browser/package-lock.json

      # A dev tool: @playwright/test, pinned in package-lock.json, and
      # nothing it installs is served. --ignore-scripts because none of it
      # needs an install script to work.
      - name: npm ci
        run: npm ci --ignore-scripts

      - name: install Chromium and its system libraries
        run: npx playwright install --with-deps chromium

      # The manual checklist of docs/COMPLETION_REPORT.md §6, against the
      # gateway replaying a SYNTHETIC night (examples/fixture_night.rs).
      - name: playwright test
        run: npx playwright test

      - name: keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: rust/crates/saans-gateway/tests/browser/test-results/
          retention-days: 7
