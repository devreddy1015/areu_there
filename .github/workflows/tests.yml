# The three test suites of record (COMPLETION_REPORT §5, RUN.md §3).
#
# Until this file, nothing in CI compiled or ran a test: the only workflow
# was CodeQL with `build-mode: none`. ADR-008 decision 14 names a job like
# this as a prerequisite, because every rule that ADR states is enforced
# by `cargo test` and would otherwise be enforced by review alone.
#
# Written on a machine with no push access, so this has never run on
# GitHub. Every command in it was run locally first (RUN.md §3); the first
# push is what will show whether the runner agrees.
name: "Tests"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain rustup rather than a third-party action: the repo is
      # dependency-shy, and the runner already ships rustup.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --workspace --locked
        working-directory: rust
      # The room demo is compiled only with this feature (ADR-008 decision
      # 13), so its tests run only here. Not --all-features: that would also
      # switch on features meant to stay off in some crates.
      - run: cargo test -p saans-gateway --features roomsim --locked
        working-directory: rust

  python:
    name: Python reference (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 3.12, not "latest": the golden hashes were taken on CPython >= 3.12,
      # whose float sum() is Neumaier-compensated (NOTES.md §7.2). On 3.11
      # two tests fail for that reason alone.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # test_replay_send_over_udp bursts ~600 datagrams at a loopback socket
      # that asks for a 1 MB receive buffer. The kernel default rmem_max
      # (212992) caps it at ~416 KB and drops ~7% of them (measured: 598
      # sent, 555 received). Raise the cap rather than weaken the test.
      - run: sudo sysctl -w net.core.rmem_max=4194304
      - run: python -m unittest discover -s tests

  edge:
    name: Edge DSP (C++, golden vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C edge/dsp/test check
